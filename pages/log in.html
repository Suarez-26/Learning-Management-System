<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/log in.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/componets.css">
    <title>Document</title>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">
                <div class="login-logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <h1>LMS ABC</h1>
                <p>Sistema de Gestión de Aprendizaje</p>
            </div>

            <div class="login-card">
                <div class="login-header">
                    <h2>Bienvenido</h2>
                    <p>Ingresa tus credenciales para continuar</p>
                </div>

                <div class="login-body">
                    <div id="loginError" class="login-error"></div>
                    
                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="admin@abc.edu" required>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="password-toggle">
                                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                                <button type="button" class="password-toggle-btn" onclick="togglePassword()">
                                    <span id="toggleIcon">👁️</span>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg">
                            <span>Iniciar Sesión</span>
                        </button>
                    </form>
                </div>

                <div class="login-footer">
                    <p><strong>Credenciales por defecto:</strong></p>
                    <p>Email: admin@abc.edu | Password: admin123</p>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="public/cursos-publicos.html" class="login-back">
                    ← Ver cursos públicos
                </a>
            </div>
        </div>
    </div>
</body>
<script src="../script/log in.js"></script>
</html>
