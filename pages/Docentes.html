<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Docentes - ABC</title>
    <link rel="stylesheet" href="../css/Docentes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">ABC</div>
            <nav>
                <a href="Dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="./Docentes.html" class="nav-item"><i data-lucide="users"></i> Docentes</a>
                <a href="#" class="nav-item active"><i data-lucide="book-open"></i> Cursos</a>
                <a href="#" class="nav-item"><i data-lucide="user-check"></i> Admins</a>
                <a href="#" class="nav-item"><i data-lucide="settings"></i> Configuración</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-blue">
                    <h2>Gestión de Docentes</h2>
                </div>
                <div class="user-info">
                    <i class="fa-regular fa-bell"></i>
                    <img src="https://via.placeholder.com/40" alt="User">
                    <span>Neffie Surner <i class="fa-solid fa-chevron-down"></i></span>
                </div>
            </header>

            <section class="content-body">
                <button class="btn-add" id="openAddModal">Añadir Docente</button>

                <div class="table-container">
                    <table id="teacherTable">
                        <thead>
                            <tr>
                                <th>Photo</th>
                                <th>ID</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Email</th>
                                <th>Área Académica</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="teacherList">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modalAdd" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Teacher Modal</h3>
                <span class="close" onclick="closeModal('modalAdd')">&times;</span>
            </div>
            <form id="teacherForm">
                <input type="text" id="photo" placeholder="URL de Foto" required>
                <input type="text" id="docId" placeholder="ID (Ej: 12)" required>
                <input type="text" id="names" placeholder="Nombres" required>
                <input type="text" id="lastnames" placeholder="Apellidos" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="area" placeholder="Área Académica" required>
                <div class="modal-footer">
                    <button type="submit" class="btn-confirm">Confirm Docente</button>
                    <button type="button" class="btn-cancel" onclick="closeModal('modalAdd')">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalConfirm" class="modal">
        <div class="modal-content confirm-modal">
            <h3 id="confirmTitle">Confirmar Acción</h3>
            <p id="confirmText">¿Estás seguro de realizar esta acción?</p>
            <div class="modal-footer">
                <button id="btnActionConfirm" class="btn-confirm">Aceptar</button>
                <button class="btn-cancel" onclick="closeModal('modalConfirm')">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="../script/Docentes.js"></script>
</body>
</html>
